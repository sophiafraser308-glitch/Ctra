services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: trader
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: trading
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U trader -d trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: ctrader-tg-platform:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://trader:${POSTGRES_PASSWORD}@db:5432/trading
      APP_ENV: ${APP_ENV:-demo}
    ports:
      - "${PORT:-8080}:${PORT:-8080}"
    volumes:
      - strategy_cache:/app/strategies/_store

volumes:
  pgdata:
  strategy_cache:
